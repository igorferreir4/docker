version: 2.1

setup: true

parameters:
  run-all:
    type: boolean
    default: false

orbs:
  continuation: circleci/continuation@1.1.0

jobs:
  generate-config:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Generate dynamic configuration
          command: |
            if [ "<< pipeline.parameters.run-all >>" = "true" ]; then
              bash .circleci/scripts/generate-config.sh --all /tmp/continue.yml
            else
              git fetch origin main --depth=100 || true
              bash .circleci/scripts/generate-config.sh /tmp/continue.yml
            fi
      - continuation/continue:
          configuration_path: /tmp/continue.yml

workflows:
  setup:
    jobs:
      - generate-config
