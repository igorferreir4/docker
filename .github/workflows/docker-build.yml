name: Docker build test

on:
  workflow_dispatch:
    inputs:
      target:
        description: App e versão no formato app/versão, ou all
        required: true
        default: caddy/2.11.9
        type: string
      publish:
        description: Publicar no Docker Hub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        name: Generate build matrix
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          MATRIX=$(bash .github/scripts/generate-matrix.sh "$TARGET")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.app }} ${{ matrix.version }} ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          APP: ${{ matrix.app }}
          IMAGE_TAGS: ${{ matrix.tags }}
        run: |
          TAGS=""
          for tag in $(echo "$IMAGE_TAGS" | tr ',' ' '); do
            TAGS="${TAGS}igorferreir4/${APP}:${tag}"$'\n'
          done
          {
            echo 'value<<EOF'
            printf '%s' "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.app }}/${{ matrix.version }}
          file: containers/${{ matrix.app }}/${{ matrix.version }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ${{ steps.tags.outputs.value }}
          cache-from: |
            type=gha,scope=${{ matrix.app }}-${{ matrix.version }}-${{ matrix.variant }}
            type=registry,ref=igorferreir4/buildcaches:${{ matrix.app }}-${{ matrix.version }}-amd64${{ matrix.suffix }}
            type=registry,ref=igorferreir4/buildcaches:${{ matrix.app }}-${{ matrix.version }}-arm64${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.version }}-${{ matrix.variant }},mode=max
